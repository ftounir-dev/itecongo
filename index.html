<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ITE Congo | Business Overview</title>
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#14231F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ITE Congo">
<style>
  html, body { margin: 0; height: 100%; background: #14231F; font-family: system-ui, sans-serif; color: #CFE7DD; }
  iframe { display: block; border: 0; width: 100%; height: 100%; }
  p { padding: 32px 24px; text-align: center; }
</style>
</head>
<body>
<script>
  // The access key is not stored in this page. It arrives in the link (?k=...)
  // the first time and is remembered on this device for later visits
  // (e.g. when opened from the home-screen icon).
  var APP = 'https://script.google.com/macros/s/AKfycbwYhgOuitJqCIDAZw8RUjCiD6fca2SYfjvanvExoGrtLOoOmDrpJWmQ5UOgDfWB7YcrjA/exec';
  var k = new URLSearchParams(location.search).get('k');
  try { if (k) localStorage.setItem('ite_k', k); else k = localStorage.getItem('ite_k'); } catch (e) {}
  if (k) {
    var f = document.createElement('iframe');
    f.title = 'ITE Congo | Business Overview';
    f.src = APP + '?k=' + encodeURIComponent(k);
    document.body.appendChild(f);
    if (location.search) history.replaceState(null, '', location.pathname);
  } else {
    document.body.innerHTML = '<p>Please open the app from the link you received.</p>';
  }
</script>
</body>
</html>
